title: "CUT&RUN Upstream QC Summary"
subtitle: "Combined FastQC, Trimmomatic, Bowtie2, Picard, and Samtools QC"

trimmomatic:
  s_name_filenames: true

extra_fn_clean_exts:
  - "_bowtie2"
  - "_trimmomatic"
  - "_dup"
  - "_paired"

module_order:
  - fastqc:
      name: "FastQC (Raw)"
      path_filters:
        - "*_R1_*.zip"
        - "*_R2_*.zip"
      path_filters_exclude:
        - "*_paired*"
  - trimmomatic
  - fastqc:
      name: "FastQC (Trimmed)"
      path_filters:
        - "*_paired*"
  - bowtie2
  - picard
  - samtools
